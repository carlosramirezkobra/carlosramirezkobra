<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noticias — Carlos Ramírez Kobra</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Canvas Effect */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Fixed Navigation Bar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3.5rem;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 100;
    }

    .navbar .logo {
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-links a {
      color: #aaaaaa;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffffff;
    }

    /* Hamburger Menu Button */
    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.8rem;
      cursor: pointer;
      outline: none;
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 2;
      padding: 8rem 0 5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .content-container {
      width: 85%;
      max-width: 1100px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 3rem 2.5rem;
      margin: 0 auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .page-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .page-subtitle {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #888888;
      text-transform: uppercase;
    }

    /* Listado de Noticias */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .news-card {
      display: flex;
      gap: 2rem;
      background: rgba(15, 15, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1.5rem;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .news-card:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .news-image {
      flex: 0 0 280px;
      height: 180px;
      border-radius: 3px;
      overflow: hidden;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .news-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(30%);
      transition: filter 0.3s ease;
    }

    .news-card:hover .news-image img {
      filter: grayscale(0%);
    }

    .news-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .news-meta {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 0.5rem;
    }

    .news-title {
      font-size: 1.4rem;
      font-weight: 300;
      color: #ffffff;
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .news-excerpt {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #bbbbbb;
      font-weight: 300;
      margin-bottom: 1.2rem;
    }

    .btn-read-more {
      align-self: flex-start;
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .btn-read-more:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Paginador */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .page-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaaaaa;
      padding: 0.5rem 0.9rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .page-btn:hover,
    .page-btn.active {
      border-color: #ffffff;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2.5rem;
      font-size: 0.85rem;
      color: #666666;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: #000000;
    }

    /* Adaptabilidad Móvil */
    @media (max-width: 992px) {
      .navbar { padding: 1.2rem 1.8rem; }
      .hamburger-btn { display: block; }

      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(5, 5, 5, 0.96);
        backdrop-filter: blur(15px);
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: none;
      }

      .nav-links.mobile-active {
        display: flex;
      }

      .content-container {
        width: 92%;
        padding: 1.8rem 1.2rem;
      }

      .news-card {
        flex-direction: column;
        gap: 1.2rem;
      }

      .news-image {
        width: 100%;
        flex: none;
        height: 200px;
      }

      .news-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Canvas Background for Scroll Down Effect -->
  <canvas id="bg-canvas"></canvas>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="index.html#hero" class="logo">Carlos Ramírez Kobra</a>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menú">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#hero">Inicio</a></li>
      <li><a href="index.html#semblanza">Semblanza</a></li>
      <li><a href="index.html#proyectos">Proyectos</a></li>
      <li><a href="index.html#cine">Cine & Videopoesía</a></li>
      <li><a href="index.html#laboratorios">Laboratorios</a></li>
      <li><a href="noticias.html" class="active">Noticias</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main>
    <section class="content-container">
      
      <header class="page-header">
        <h1 class="page-title">Noticias </h1>
        <p class="page-subtitle">Actualizaciones, publicaciones y presentaciones</p>
      </header>

      <!-- Lista donde se renderizan las noticias -->
      <div class="news-list" id="newsList"></div>

      <!-- Paginador dinámico -->
      <div class="pagination-container" id="pagination"></div>

    </section>
  </main>

  <footer>
    <p>&copy; Carlos Ramírez (Kobra). Alojado en GitHub Pages.</p>
  </footer>

  <!-- JavaScript Logic -->
  <script>
    /* 1. Datos de las Noticias (Añade o edita noticias aquí) */
    const newsData = [
      {
        id: "noticia-1",
        fecha: "Julio 2026",
        categoria: "Literatura electrónica",
        titulo: "Presentación Online de 'Symbolic Homes'",
        resumen: "Presentación online de Symbolic Homes por Facebook Live en la cuneta de la Plataforma PLACA. Contará con la participación activa de lxs autorxs y las intervenciones especiales de Martín Rangel, Vinicius Marquet e Iván Vergara como presentadorxs.",
        imagen: "img/Flyer_SH_26_Sept.png",
        link: "noticias/symbolics-homes.html"
      },
      {
        id: "noticia-2",
        fecha: "POSVERSO — Bienal, poesía electrónica",
        categoria: "Exposición, Literatura electrónica",
        titulo: "Participación en POSVERSO Bienal",
        resumen: "Exposición y presentación de la obra Cyber_bardX de Carlos Ramírez Kobra en POSVERSO Bienal en Argentina, bajo la curaduría de Claudia Kozak de Poesía digital Pasados/Presentes, del encantamiento al horror, al lado de piezas de diferentes artistas de latinoamérica.",
        imagen: "img/Posverso26.jpg",
        link: "#"
      },
      {
        id: "noticia-3",
        fecha: "Septiembre 2026",
        categoria: "Conferencia",
        titulo: "Literaturas digitales en circulación",
        resumen: "  Participación en las Jornadas de estudio, Literaturas digitales en circulación con la presentación del Volumen 2 de la Antología LitElat y en la Mesa 5 con la ponencia «El homo-transmedialis. Literatura expandida, hibridación de códigos, nodos en red y modos de subjetivación contemporánea».",
        imagen: "img/LitDigCirculacion.png",
        link: "#"
      }
    ];

    /* 2. Lógica de Paginación */
    const ITEMS_PER_PAGE = 10;
    let currentPage = 1;

    function renderNews(page) {
      const newsList = document.getElementById('newsList');
      newsList.innerHTML = '';

      const startIndex = (page - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const pageItems = newsData.slice(startIndex, endIndex);

      if (pageItems.length === 0) {
        newsList.innerHTML = '<p style="color:#888;">No hay noticias disponibles.</p>';
        return;
      }

      pageItems.forEach(item => {
        const card = document.createElement('article');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="news-image">
            <img src="${item.imagen}" alt="${item.titulo}" onerror="this.parentNode.style.background='#222'; this.style.display='none';">
          </div>
          <div class="news-content">
            <div>
              <div class="news-meta">${item.fecha} — ${item.categoria}</div>
              <h2 class="news-title">${item.titulo}</h2>
              <p class="news-excerpt">${item.resumen}</p>
            </div>
            <a href="${item.link}" class="btn-read-more">Continuar leyendo →</a>
          </div>
        `;
        newsList.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.innerHTML = '';

      const totalPages = Math.ceil(newsData.length / ITEMS_PER_PAGE);

      if (totalPages <= 1) return; // No muestra paginación si hay 10 o menos noticias

      // Botón Anterior
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '← Anterior';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderNews(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      paginationContainer.appendChild(prevBtn);

      // Botones Numéricos
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.addEventListener('click', () => {
          currentPage = i;
          renderNews(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        paginationContainer.appendChild(pageBtn);
      }

      // Botón Siguiente
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = 'Siguiente →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderNews(currentPage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      paginationContainer.appendChild(nextBtn);
    }

    // Inicializar renderizado
    renderNews(currentPage);

    /* 3. Menú Hamburguesa Móvil */
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');

    hamburgerBtn.addEventListener('click', () => {
      navLinks.classList.toggle('mobile-active');
    });

    /* 4. Canvas Effect con 'cuerpos_obra.jpg' */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgWidth = bgCanvas.width = window.innerWidth;
    let bgHeight = bgCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      bgWidth = bgCanvas.width = window.innerWidth;
      bgHeight = bgCanvas.height = window.innerHeight;
    });

    const imgCuerpos = new Image();
    imgCuerpos.src = 'img/cuerpos_obra.jpg';

    function renderBgCanvas() {
      bgCtx.clearRect(0, 0, bgWidth, bgHeight);

      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollProgress = maxScroll > 0 ? Math.min(1, Math.max(0, scrollTop / maxScroll)) : 0;

      if (imgCuerpos.complete && imgCuerpos.naturalWidth > 0) {
        bgCtx.save();
        
        const alpha = 0.2 + (scrollProgress * 0.25);
        const scale = 0.35 + (scrollProgress * 0.15);

        bgCtx.globalAlpha = alpha;
        
        const drawW = bgWidth * scale;
        const drawH = drawW * (imgCuerpos.naturalHeight / imgCuerpos.naturalWidth);
        
        bgCtx.drawImage(imgCuerpos, (bgWidth - drawW) / 2, (bgHeight - drawH) / 2, drawW, drawH);
        bgCtx.restore();
      }

      requestAnimationFrame(renderBgCanvas);
    }

    renderBgCanvas();
  </script>
</body>
</html>
